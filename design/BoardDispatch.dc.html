<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    a { color: #c8102e; } a:hover { color: #9c0c23; }
    .cond { font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system, sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 1194px; height: 834px; background: #ffffff; color: #201c16; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 92px; flex-shrink: 0; background: #16130f; color: #f4f2ee; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2" y="3" width="20" height="16" rx="3" stroke="#f4f2ee" stroke-width="1.6"></rect>
        <rect x="2" y="3" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="12" y="3" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="7" y="7" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="17" y="7" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="2" y="11" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="12" y="11" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="7" y="15" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="17" y="15" width="5" height="4" fill="#f4f2ee"></rect>
      </svg>
      <span class="cond" style="font-size: 30px; font-weight: 700;">PitCrew</span>
    </div>
    <span class="num cond" style="font-size: 28px; font-weight: 600; color: #948b7d;">2:14 PM</span>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0;">

    <div style="border-right: 2px solid #201c16; display: flex; flex-direction: column;">
      <div style="background: #1c7f45; color: #ffffff; padding: 16px 22px; display: flex; align-items: baseline; justify-content: space-between;">
        <span class="cond" style="font-size: 27px; font-weight: 700;">Ready to take</span>
        <span class="cond num" style="font-size: 34px; font-weight: 700;">1</span>
      </div>
      <div style="padding: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div style="border: 3px solid #1c7f45; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
          <div style="display: flex; align-items: center; gap: 14px;">
            <span style="width: 34px; height: 34px; background: #1f6fb2; flex-shrink: 0;"></span>
            <span class="cond" style="font-size: 40px; font-weight: 700; line-height: 1;">Blue Car</span>
          </div>
          <div style="height: 62px; background: #1c7f45; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700;">Tap to take</div>
        </div>
      </div>
    </div>

    <div style="border-right: 2px solid #201c16; display: flex; flex-direction: column;">
      <div style="background: #16130f; color: #ffffff; padding: 16px 22px; display: flex; align-items: baseline; justify-content: space-between;">
        <span class="cond" style="font-size: 27px; font-weight: 700;">Out now</span>
        <span class="cond num" style="font-size: 34px; font-weight: 700;">2</span>
      </div>
      <div style="padding: 18px; display: flex; flex-direction: column; gap: 14px;">

        <div style="border: 2px solid #d2ccbf; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="width: 30px; height: 30px; background: #c8102e; flex-shrink: 0;"></span>
            <span class="cond" style="font-size: 34px; font-weight: 700; line-height: 1;">Red Car</span>
          </div>
          <div style="display: flex; align-items: baseline; justify-content: space-between;">
            <span style="font-size: 20px; font-weight: 600;">Marcus T.</span>
            <span class="num" style="font-size: 23px; font-weight: 700;">1h 22m</span>
          </div>
          <div style="height: 52px; border: 2px solid #201c16; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;">Tap to return</div>
        </div>

        <div style="border: 3px solid #a9760a; background: #fdf8ee; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="width: 30px; height: 30px; background: #1c1c1c; flex-shrink: 0;"></span>
            <span class="cond" style="font-size: 34px; font-weight: 700; line-height: 1;">Black Car</span>
          </div>
          <div style="display: flex; align-items: center; gap: 7px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 8v5M12 16.5v.2" stroke="#a9760a" stroke-width="2.2" stroke-linecap="round"></path>
              <path d="M10.3 3.9L2.7 17.4c-.7 1.2.2 2.6 1.6 2.6h15.4c1.4 0 2.3-1.4 1.6-2.6L13.7 3.9c-.7-1.2-2.6-1.2-3.4 0z" stroke="#a9760a" stroke-width="1.7"></path>
            </svg>
            <span class="cond" style="font-size: 19px; font-weight: 700; color: #a9760a;">Overdue &middot; no sign-out</span>
          </div>
          <div style="display: flex; align-items: baseline; justify-content: space-between;">
            <span style="font-size: 20px; font-weight: 600;">Dani R.</span>
            <span class="num" style="font-size: 23px; font-weight: 700; color: #a9760a;">14h 07m</span>
          </div>
          <div style="height: 52px; border: 2px solid #201c16; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;">Tap to return</div>
        </div>

      </div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div style="background: #6b6357; color: #ffffff; padding: 16px 22px; display: flex; align-items: baseline; justify-content: space-between;">
        <span class="cond" style="font-size: 27px; font-weight: 700;">Unavailable</span>
        <span class="cond num" style="font-size: 34px; font-weight: 700;">1</span>
      </div>
      <div style="padding: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div style="border: 2px dashed #b9b3a7; background: #f4f2ee; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="width: 30px; height: 30px; background: #b9b3a7; flex-shrink: 0;"></span>
            <span class="cond" style="font-size: 34px; font-weight: 700; line-height: 1; color: #6b6357;">White Car</span>
          </div>
          <span class="cond" style="font-size: 19px; font-weight: 600; color: #6b6357;">Out of service</span>
        </div>
      </div>
    </div>

  </div>

  <div style="height: 112px; flex-shrink: 0; border-top: 2px solid #201c16; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div style="background: #201c16; color: #ffffff; display: flex; align-items: center; justify-content: center;">
      <span class="cond" style="font-size: 28px; font-weight: 700;">Vehicles</span>
    </div>
    <div style="border-right: 2px solid #201c16; display: flex; align-items: center; justify-content: center; gap: 12px;">
      <span class="cond" style="font-size: 28px; font-weight: 700;">Hot Bags</span>
      <span class="num" style="min-width: 34px; height: 34px; background: #a9760a; color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 10px;">2</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
      <span class="cond" style="font-size: 28px; font-weight: 700;">Slow Tasks</span>
      <span class="num" style="min-width: 34px; height: 34px; background: #a9760a; color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 10px;">1</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
