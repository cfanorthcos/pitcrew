<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif; }
    a { color: #c8102e; } a:hover { color: #9c0c23; }
    .display { font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; letter-spacing: -0.025em; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 1194px; height: 834px; background: #f4f2ee; color: #201c16; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 92px; flex-shrink: 0; background: #16130f; color: #f4f2ee; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2" y="3" width="20" height="16" rx="3" stroke="#f4f2ee" stroke-width="1.6"></rect>
        <rect x="2" y="3" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="12" y="3" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="7" y="7" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="17" y="7" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="2" y="11" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="12" y="11" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="7" y="15" width="5" height="4" fill="#f4f2ee"></rect>
        <rect x="17" y="15" width="5" height="4" fill="#f4f2ee"></rect>
      </svg>
      <span class="display" style="font-size: 24px; font-weight: 700;">PitCrew</span>
    </div>
    <div style="display: flex; align-items: center; gap: 28px;">
      <span style="font-size: 19px; color: #f4f2ee;"><b class="display num" style="font-size: 30px;">2</b> out</span>
      <span style="width: 1px; height: 28px; background: #3a342b;"></span>
      <span style="font-size: 19px; color: #f4f2ee;"><b class="display num" style="font-size: 30px;">1</b> free</span>
      <span style="width: 1px; height: 28px; background: #3a342b;"></span>
      <span class="num" style="font-size: 22px; color: #948b7d;">2:14 PM</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding: 24px 28px;">

    <div style="background: #ffffff; border: 1px solid #e2ddd3; border-radius: 20px; box-shadow: 0 2px 4px rgba(32,28,22,0.04), 0 8px 24px -12px rgba(32,28,22,0.18); display: flex; overflow: hidden;">
      <div style="width: 14px; background: #c8102e; flex-shrink: 0;"></div>
      <div style="padding: 24px 28px; display: flex; flex-direction: column; flex-grow: 1;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between;">
          <span class="display" style="font-size: 36px; font-weight: 700;">Red Car</span>
          <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: #1f6fb2; background: #eaf2f9; padding: 7px 13px; border-radius: 8px;">IN USE</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <div style="font-size: 24px; font-weight: 600;">Marcus T.</div>
        <div style="font-size: 18px; color: #6b6357; margin-top: 3px;"><b class="num" style="font-size: 22px; color: #201c16;">1h 22m</b> on shift</div>
        <div style="margin-top: 18px; height: 56px; border-radius: 12px; border: 1px solid #d2ccbf; background: #edeae4; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600; color: #201c16;">Tap to return</div>
      </div>
    </div>

    <div style="background: #ffffff; border: 2px solid #1c7f45; border-radius: 20px; box-shadow: 0 2px 4px rgba(32,28,22,0.04), 0 8px 24px -12px rgba(32,28,22,0.18); display: flex; overflow: hidden;">
      <div style="width: 14px; background: #1f6fb2; flex-shrink: 0;"></div>
      <div style="padding: 24px 28px; display: flex; flex-direction: column; flex-grow: 1;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between;">
          <span class="display" style="font-size: 36px; font-weight: 700;">Blue Car</span>
          <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: #1c7f45; background: #e7f2ec; padding: 7px 13px; border-radius: 8px;">AVAILABLE</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <div style="margin-top: 18px; height: 56px; border-radius: 12px; background: #1c7f45; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 600; color: #ffffff;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12.5l4.2 4.2L19 7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          Tap to take
        </div>
      </div>
    </div>

    <div style="background: #fdf8ee; border: 2px solid #a9760a; border-radius: 20px; box-shadow: 0 2px 4px rgba(32,28,22,0.04), 0 8px 24px -12px rgba(32,28,22,0.18); display: flex; overflow: hidden;">
      <div style="width: 14px; background: #1c1c1c; flex-shrink: 0;"></div>
      <div style="padding: 24px 28px; display: flex; flex-direction: column; flex-grow: 1;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between;">
          <span class="display" style="font-size: 36px; font-weight: 700;">Black Car</span>
          <span style="display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: #a9760a; background: #f7ecd6; padding: 7px 13px; border-radius: 8px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 8v5M12 16.5v.2" stroke="#a9760a" stroke-width="2.2" stroke-linecap="round"></path>
              <path d="M10.3 3.9L2.7 17.4c-.7 1.2.2 2.6 1.6 2.6h15.4c1.4 0 2.3-1.4 1.6-2.6L13.7 3.9c-.7-1.2-2.6-1.2-3.4 0z" stroke="#a9760a" stroke-width="1.7"></path>
            </svg>
            OVERDUE
          </span>
        </div>
        <div style="flex-grow: 1;"></div>
        <div style="font-size: 24px; font-weight: 600;">Dani R.</div>
        <div style="font-size: 18px; color: #6b6357; margin-top: 3px;"><b class="num" style="font-size: 22px; color: #a9760a;">14h 07m</b> without signing out</div>
        <div style="margin-top: 18px; height: 56px; border-radius: 12px; border: 1px solid #d2ccbf; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600; color: #201c16;">Tap to return</div>
      </div>
    </div>

    <div style="background: #edeae4; border: 1px solid #e2ddd3; border-radius: 20px; display: flex; overflow: hidden;">
      <div style="width: 14px; background: #b9b3a7; flex-shrink: 0;"></div>
      <div style="padding: 24px 28px; display: flex; flex-direction: column; flex-grow: 1;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between;">
          <span class="display" style="font-size: 36px; font-weight: 700; color: #948b7d;">White Car</span>
          <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: #6b6357; background: #e2ddd3; padding: 7px 13px; border-radius: 8px;">OUT OF SERVICE</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <div style="font-size: 18px; color: #948b7d;">Not available to take out.</div>
      </div>
    </div>
  </div>

  <div style="height: 112px; flex-shrink: 0; background: #ffffff; border-top: 1px solid #e2ddd3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: inset 0 -4px 0 #c8102e; color: #201c16;">
      <span style="font-size: 23px; font-weight: 600;">Vehicles</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; color: #6b6357;">
      <span style="font-size: 23px; font-weight: 600;">Hot Bags</span>
      <span class="num" style="min-width: 32px; height: 32px; border-radius: 16px; background: #a9760a; color: #ffffff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 10px;">2</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; color: #6b6357;">
      <span style="font-size: 23px; font-weight: 600;">Slow Tasks</span>
      <span class="num" style="min-width: 32px; height: 32px; border-radius: 16px; background: #a9760a; color: #ffffff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 10px;">1</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
