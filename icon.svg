<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PitCrew">
  <rect width="512" height="512" rx="112" fill="#16130f"/>
  <!-- checkered flag: 4x3 grid of alternating squares, CFA red on cream -->
  <g transform="translate(112 150)">
    <rect x="0" y="0" width="288" height="216" rx="16" fill="#f4f2ee"/>
    <g fill="#c8102e">
      <rect x="0"   y="0"  width="72" height="72"/>
      <rect x="144" y="0"  width="72" height="72"/>
      <rect x="72"  y="72" width="72" height="72"/>
      <rect x="216" y="72" width="72" height="72"/>
      <rect x="0"   y="144" width="72" height="72"/>
      <rect x="144" y="144" width="72" height="72"/>
    </g>
  </g>
</svg>
