<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <!-- Added to the iPad home screen this runs full-screen, without Safari chrome. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PitCrew" />
  <title>PitCrew</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="css/kiosk.css" />
</head>
<body>
  <div id="banner-region"></div>

  <div class="kiosk">
    <!-- HEADER: brand row swaps for a back/cancel row on the flow screens ---->
    <header class="k-header">
      <div class="k-navrow">
        <div class="k-brand" id="nav-brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="2" y="3" width="20" height="16" rx="3" stroke="currentColor" stroke-width="1.6" />
            <rect x="2" y="3" width="5" height="4" fill="currentColor" />
            <rect x="12" y="3" width="5" height="4" fill="currentColor" />
            <rect x="7" y="7" width="5" height="4" fill="currentColor" />
            <rect x="17" y="7" width="5" height="4" fill="currentColor" />
            <rect x="2" y="11" width="5" height="4" fill="currentColor" />
            <rect x="12" y="11" width="5" height="4" fill="currentColor" />
            <rect x="7" y="15" width="5" height="4" fill="currentColor" />
            <rect x="17" y="15" width="5" height="4" fill="currentColor" />
          </svg>
          <span>PitCrew</span>
        </div>

        <button type="button" class="k-navbtn hidden" id="nav-back">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span id="nav-back-label">Vehicles</span>
        </button>

        <div class="k-navctx hidden" id="nav-context">
          <span class="k-swatch" id="nav-swatch"></span>
          <span id="nav-context-name"></span>
        </div>

        <button type="button" class="k-navbtn hidden" id="nav-cancel">Cancel</button>

        <span class="k-clock" id="nav-clock" data-clock>—</span>

        <!-- The only route to admin. In standalone PWA mode there is no address
             bar, so without this the dashboard cannot be reached from the wall
             iPad at all. Quiet, but deliberately not a secret gesture. -->
        <a class="k-adminlink" id="nav-admin" href="admin.html" aria-label="Admin dashboard">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7.5h10M18 7.5h2M4 16.5h2M10 16.5h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="16" cy="7.5" r="2.3" stroke="currentColor" stroke-width="1.8" />
            <circle cx="8" cy="16.5" r="2.3" stroke="currentColor" stroke-width="1.8" />
          </svg>
          <span>Admin</span>
        </a>
      </div>

      <div class="k-titlerow">
        <h1 class="k-title" id="k-title">Vehicles</h1>
        <div class="k-trailing" id="k-trailing"></div>
      </div>
    </header>

    <main class="k-main" id="k-main">
      <!-- VEHICLES ------------------------------------------------------- -->
      <section class="k-panel active" id="panel-vehicles">
        <div class="tile-grid" id="vehicle-board"></div>
      </section>

      <!-- HOT BAGS ------------------------------------------------------- -->
      <section class="k-panel" id="panel-hotbags">
        <div class="tile-grid" id="hotbag-list"></div>
      </section>

      <!-- SLOW TASKS ----------------------------------------------------- -->
      <section class="k-panel" id="panel-slowtasks">
        <div id="slowtask-list"></div>
      </section>

      <!-- WHO'S DRIVING -------------------------------------------------- -->
      <section class="k-panel" id="panel-identity">
        <div class="search">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.6" stroke="#8e8e93" stroke-width="2" />
            <path d="M15.6 15.6L20.5 20.5" stroke="#8e8e93" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input type="text" id="driver-search" placeholder="Type your name" autocomplete="off"
                 autocorrect="off" autocapitalize="words" spellcheck="false" aria-label="Search for your name" />
          <button type="button" class="search-clear hidden" id="driver-search-clear" aria-label="Clear">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7.5 7.5l9 9M16.5 7.5l-9 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div id="identity-results" class="stack-gap"></div>
      </section>

      <!-- RETURN --------------------------------------------------------- -->
      <section class="k-panel" id="panel-return">
        <div class="return-grid">
          <div>
            <div class="group" id="return-checklist"></div>
          </div>
          <div class="stack">
            <span class="group-head">Anything we should know?</span>
            <textarea class="notes" id="return-notes"
                      placeholder="Optional — damage, a warning light, low fuel, anything the next driver needs to know."></textarea>
            <button type="button" class="btn btn-quiet" id="submit-return-btn" disabled>Complete &amp; Sign Out</button>
          </div>
        </div>
      </section>
    </main>

    <!-- TAB BAR: low, because a wall-mounted screen is reached from below -->
    <nav class="k-tabbar" id="tab-bar" role="tablist" aria-label="Sections">
      <button type="button" class="k-tab" role="tab" data-tab="vehicles" aria-selected="true">
        <span class="k-tab-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 16.5v2.2a.8.8 0 00.8.8h1.9a.8.8 0 00.8-.8v-1.2M20 16.5v2.2a.8.8 0 01-.8.8h-1.9a.8.8 0 01-.8-.8v-1.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            <path d="M3.6 16.5h16.8a.6.6 0 00.6-.6v-3.1c0-1-.7-1.9-1.7-2.1l-1.5-.3-1.7-3.3a2 2 0 00-1.8-1.1H9.7a2 2 0 00-1.8 1.1L6.2 10.4l-1.5.3c-1 .2-1.7 1.1-1.7 2.1v3.1c0 .3.3.6.6.6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
            <path d="M7 13.4h1.4M15.6 13.4H17" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
        </span>
        <span class="k-tab-label">Vehicles</span>
      </button>

      <button type="button" class="k-tab" role="tab" data-tab="hotbags" aria-selected="false">
        <span class="k-tab-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5.6 8.5h12.8l1 11a1.4 1.4 0 01-1.4 1.5H6a1.4 1.4 0 01-1.4-1.5l1-11z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
            <path d="M8.8 8.5V6.8a3.2 3.2 0 016.4 0v1.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <span class="k-tab-badge hidden" data-count="hotbags">0</span>
        </span>
        <span class="k-tab-label">Hot Bags</span>
      </button>

      <button type="button" class="k-tab" role="tab" data-tab="slowtasks" aria-selected="false">
        <span class="k-tab-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12.6" r="8.4" stroke="currentColor" stroke-width="1.7" />
            <path d="M12 8.2v4.6l3 1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="k-tab-badge hidden" data-count="slowtasks">0</span>
        </span>
        <span class="k-tab-label">Slow Tasks</span>
      </button>
    </nav>
  </div>

  <div id="modal-region"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
