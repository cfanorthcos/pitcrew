<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16130f" />
  <meta name="color-scheme" content="light" />
  <title>PitCrew Admin</title>
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div id="banner-region"></div>

  <!-- LOCK SCREEN: casual PIN deterrent, not real auth — see js/config.js ---- -->
  <div class="lock-overlay" id="lock-overlay">
    <div class="lock-card">
      <span class="lock-mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="3" width="20" height="16" rx="3" stroke="currentColor" stroke-width="1.6" />
          <rect x="2" y="3" width="5" height="4" fill="currentColor" />
          <rect x="12" y="3" width="5" height="4" fill="currentColor" />
          <rect x="7" y="7" width="5" height="4" fill="currentColor" />
          <rect x="17" y="7" width="5" height="4" fill="currentColor" />
          <rect x="2" y="11" width="5" height="4" fill="currentColor" />
          <rect x="12" y="11" width="5" height="4" fill="currentColor" />
          <rect x="7" y="15" width="5" height="4" fill="currentColor" />
          <rect x="17" y="15" width="5" height="4" fill="currentColor" />
        </svg>
      </span>
      <h1>PitCrew Admin</h1>
      <p>Enter the admin PIN to continue.</p>
      <input type="password" inputmode="numeric" id="lock-pin-input" placeholder="PIN" autocomplete="off" />
      <button type="button" class="btn btn-primary" id="lock-submit-btn">Unlock</button>
      <p class="lock-error hidden" id="lock-error">Incorrect PIN. Try again.</p>
      <!-- Essential, not decoration: the kiosk runs as a standalone PWA with no
           address bar and no back button, so a driver who taps Admin by mistake
           has no other way out of this screen. -->
      <a class="lock-back" href="index.html">&lsaquo; Back to kiosk</a>
    </div>
  </div>

  <div class="admin-shell hidden" id="admin-app">
    <!-- SIDEBAR: grouped, because eight flat items is a list not an IA ------ -->
    <aside class="admin-side">
      <div class="side-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="3" width="20" height="16" rx="3" stroke="currentColor" stroke-width="1.6" />
          <rect x="2" y="3" width="5" height="4" fill="currentColor" />
          <rect x="12" y="3" width="5" height="4" fill="currentColor" />
          <rect x="7" y="7" width="5" height="4" fill="currentColor" />
          <rect x="17" y="7" width="5" height="4" fill="currentColor" />
          <rect x="2" y="11" width="5" height="4" fill="currentColor" />
          <rect x="12" y="11" width="5" height="4" fill="currentColor" />
          <rect x="7" y="15" width="5" height="4" fill="currentColor" />
          <rect x="17" y="15" width="5" height="4" fill="currentColor" />
        </svg>
        PitCrew
        <span class="side-tag">Admin</span>
      </div>

      <nav class="side-nav" id="admin-nav" aria-label="Admin sections">
        <span class="side-group">Today</span>
        <button type="button" data-section="dashboard" class="active">Dashboard</button>

        <span class="side-group">Fleet</span>
        <button type="button" data-section="vehicles">Vehicles</button>
        <button type="button" data-section="hotbags">Hot Bags</button>

        <span class="side-group">People</span>
        <button type="button" data-section="drivers">Drivers</button>
        <button type="button" data-section="incidents">Driver Incidents</button>

        <span class="side-group">Operations</span>
        <button type="button" data-section="checklist">Return Checklist</button>
        <button type="button" data-section="slowtasks">Slow Tasks</button>

        <span class="side-group">Records</span>
        <button type="button" data-section="driver-history">Driver History</button>
      </nav>

      <div class="side-foot">
        <span data-clock>—</span>
        <a href="index.html">&lsaquo; Back to kiosk</a>
      </div>
    </aside>

    <main class="admin-main" id="admin-main">
      <section class="admin-section" id="section-dashboard"></section>
      <section class="admin-section hidden" id="section-vehicles"></section>
      <section class="admin-section hidden" id="section-vehicle-detail"></section>
      <section class="admin-section hidden" id="section-drivers"></section>
      <section class="admin-section hidden" id="section-driver-history"></section>
      <section class="admin-section hidden" id="section-checklist"></section>
      <section class="admin-section hidden" id="section-incidents"></section>
      <section class="admin-section hidden" id="section-hotbags"></section>
      <section class="admin-section hidden" id="section-slowtasks"></section>
      <section class="admin-section hidden" id="section-slowtask-detail"></section>
    </main>
  </div>

  <div id="modal-region"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
